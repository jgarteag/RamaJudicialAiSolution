name: CD

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure & Frontend
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: "rama-judicial-ai"
      TF_VAR_environment: "dev"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cloudfront_price_class: "PriceClass_100"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS role secret
        run: |
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "Missing required secret: AWS_ROLE_TO_ASSUME"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
          terraform_wrapper: false

      - name: Package Lambda
        run: |
          cd backend/lambda
          zip -j lambda.zip handler.py
          echo "✓ Lambda packaged: $(ls -lh lambda.zip | awk '{print $5}')"

      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        working-directory: infrastructure
        run: terraform apply -input=false -auto-approve tfplan

      - name: Get Terraform Outputs
        working-directory: infrastructure
        id: tf_outputs
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_id)" >> $GITHUB_OUTPUT
          echo "cf_distribution=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Generate Frontend Config
        run: |
          cat > frontend/config.js << EOF
          // Auto-generated by CD pipeline - DO NOT EDIT
          window.APP_CONFIG = {
            apiEndpoint: "${{ steps.tf_outputs.outputs.api_endpoint }}"
          };
          EOF
          echo "✓ config.js generated with API: ${{ steps.tf_outputs.outputs.api_endpoint }}"

      - name: Deploy Frontend
        run: |
          aws s3 sync frontend/ s3://${{ steps.tf_outputs.outputs.s3_bucket }}/ \
            --delete \
            --cache-control "public, max-age=3600"
          echo "✓ Frontend synced to S3"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.cf_distribution }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text
          echo "✓ CloudFront cache invalidated"
