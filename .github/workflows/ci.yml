name: CI

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      microstack:
        description: 'Microstack a validar'
        type: choice
        default: 'all'
        options:
          - all
          - frontend
          - backend-api

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate & Plan
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: "rama-judicial-ai"
      TF_VAR_environment: "dev"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cloudfront_price_class: "PriceClass_100"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: |
          cd backend/lambda
          zip -j lambda.zip handler.py

      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init

      - name: Terraform Validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure
        run: terraform plan -input=false -no-color
        continue-on-error: true
        id: plan

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### 🏗️ Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Basic repository checks
        run: |
          test -f README.md
          test -f LICENSE
          test -f frontend/index.html
          test -f infrastructure/main.tf
