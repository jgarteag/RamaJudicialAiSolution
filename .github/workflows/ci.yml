name: CI

on:
  pull_request:
    branches:
      - trunk

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Basic repository checks
        run: |
          test -f README.md
          test -f LICENSE

      - name: Install dependencies if present
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          elif [ -f radicados-bot/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r radicados-bot/requirements.txt
          else
            echo "No requirements file found. Skipping dependency install."
          fi

      - name: Run tests if present
        run: |
          if [ -d tests ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install pytest
            pytest -q
          else
            echo "No test suite found. Skipping tests."
          fi
