[project]
name = "rama-judicial-ai"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/layers", "infrastructure/.terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["backend/lambda/tests"]
pythonpath = ["backend/lambda"]
